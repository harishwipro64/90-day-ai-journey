name: Step 4 - AI Script Generation

on:
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq

      - name: Download Qwen AI model
        run: |
          mkdir -p models

          echo "Downloading Qwen 0.5B model..."

          wget -q --show-progress \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" \
            -O models/qwen.gguf

          echo ""
          echo "Model downloaded:"
          ls -lh models/qwen.gguf

      - name: Download llama.cpp
        run: |
          mkdir -p llama

          echo "Finding Ubuntu x64 CPU build of llama.cpp..."

          LLAMA_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/ggml-org/llama.cpp/releases"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions"}
          )

          releases = json.load(urllib.request.urlopen(req))

          found = None

          for release in releases:
              if release.get("draft"):
                  continue

              for asset in release.get("assets", []):
                  name = asset["name"].lower()

                  if (
                      "ubuntu-x64" in name
                      and name.endswith(".tar.gz")
                      and "cuda" not in name
                      and "vulkan" not in name
                      and "rocm" not in name
                  ):
                      found = asset["browser_download_url"]
                      break

              if found:
                  break

          if not found:
              raise SystemExit(
                  "Could not find an Ubuntu x64 CPU llama.cpp build."
              )

          print(found)
          PY
          )

          echo ""
          echo "Selected llama.cpp download:"
          echo "$LLAMA_URL"
          echo ""

          wget -q --show-progress \
            "$LLAMA_URL" \
            -O llama.tar.gz

          echo ""
          echo "Extracting llama.cpp..."

          tar -xzf llama.tar.gz -C llama

          echo ""
          echo "Searching for llama-cli..."

          LLAMA_CLI=$(find llama -type f -name "llama-cli" | head -1)

          if [ -z "$LLAMA_CLI" ]; then
            echo "ERROR: llama-cli was not found."
            echo ""
            echo "Files extracted:"
            find llama -type f | head -50
            exit 1
          fi

          chmod +x "$LLAMA_CLI"

          echo ""
          echo "llama-cli found:"
          echo "$LLAMA_CLI"

          echo ""
          echo "Testing llama-cli..."

          "$LLAMA_CLI" --version

      - name: Prepare AI prompt
        run: |
          mkdir -p output

          cat > prompt.txt <<'EOF'
          You are a professional YouTube Shorts script writer.

          I am documenting a 90-day transformation journey as a software engineer.

          Read the journal entry below and create a natural 45 to 60 second
          English voice-over script.

          Requirements:

          - Start with a strong hook.
          - Use simple spoken English.
          - Make it sound like a real person speaking.
          - Make it motivational but realistic.
          - Focus on the software engineering transformation.
          - Mention that this is Day 1.
          - Explain what I am trying to achieve.
          - Mention that I am building an automated AI video system.
          - Do not make fake claims.
          - Do not exaggerate.
          - Do not invent achievements.
          - Do not use headings.
          - Do not use bullet points.
          - Do not use stage directions.
          - Do not add explanations.
          - Output ONLY the final voice-over script.

          JOURNAL ENTRY:

          EOF

          cat daily_notes/day-001.md >> prompt.txt

          echo ""
          echo "Prompt prepared."

      - name: Generate AI script
        run: |
          mkdir -p output

          LLAMA_CLI=$(find llama -type f -name "llama-cli" | head -1)

          if [ -z "$LLAMA_CLI" ]; then
            echo "ERROR: llama-cli not found."
            exit 1
          fi

          chmod +x "$LLAMA_CLI"

          echo ""
          echo "Generating AI script..."
          echo ""

          "$LLAMA_CLI" \
            -m models/qwen.gguf \
            -f prompt.txt \
            -n 180 \
            --temp 0.7 \
            --no-display-prompt \
            > output/script.txt

          echo ""
          echo "======================================"
          echo "GENERATED AI SCRIPT"
          echo "======================================"

          cat output/script.txt

          echo ""
          echo "======================================"

      - name: Check generated script
        run: |
          if [ ! -s output/script.txt ]; then
            echo "ERROR: Script file is empty."
            exit 1
          fi

          echo ""
          echo "Script successfully generated."

          echo ""
          echo "Word count:"
          wc -w output/script.txt

          echo ""
          echo "Character count:"
          wc -c output/script.txt

      - name: Upload generated script
        uses: actions/upload-artifact@v4
        with:
          name: day-001-ai-script
          path: output/script.txt
