name: Step 4 - AI Script Generation

on:
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq

      - name: Download Qwen AI model
        run: |
          mkdir -p models

          wget -q --show-progress \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" \
            -O models/qwen.gguf

          ls -lh models/qwen.gguf

      - name: Download llama.cpp
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions"}
          )

          data = json.load(urllib.request.urlopen(req))

          for asset in data["assets"]:
              name = asset["name"].lower()

              if "ubuntu-x64" in name and name.endswith(".tar.gz"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Ubuntu x64 llama.cpp release not found")
          PY

          LLAMA_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions"}
          )

          data = json.load(urllib.request.urlopen(req))

          for asset in data["assets"]:
              name = asset["name"].lower()

              if "ubuntu-x64" in name and name.endswith(".tar.gz"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Ubuntu x64 llama.cpp release not found")
          PY
          )

          echo "Downloading:"
          echo "$LLAMA_URL"

          wget -q --show-progress "$LLAMA_URL" -O llama.tar.gz

          mkdir -p llama
          tar -xzf llama.tar.gz -C llama

          echo "Searching for llama-cli..."
          find llama -type f -name "llama-cli" -print

      - name: Generate AI script
        run: |
          mkdir -p output

          LLAMA_CLI=$(find llama -type f -name "llama-cli" | head -1)

          if [ -z "$LLAMA_CLI" ]; then
            echo "ERROR: llama-cli not found"
            exit 1
          fi

          chmod +x "$LLAMA_CLI"

          cat > prompt.txt <<'EOF'
          You are writing a YouTube Shorts script.

          Read the following Day 1 journal entry.

          Create a natural 45-60 second English voice-over script.

          Requirements:
          - Strong opening hook
          - Simple English
          - Motivational but realistic
          - Software engineer transformation journey
          - Mention that this is Day 1
          - Explain what I am trying to achieve
          - No fake achievements
          - No exaggerated claims
          - No headings
          - No bullet points
          - No stage directions
          - No quotation marks around the whole script
          - Output ONLY the final voice-over script

          JOURNAL:
          EOF

          cat daily_notes/day-001.md >> prompt.txt

          echo ""
          echo "Generating script..."

          "$LLAMA_CLI" \
            -m models/qwen.gguf \
            -f prompt.txt \
            -n 180 \
            --temp 0.7 \
            --no-display-prompt \
            > output/script.txt

          echo ""
          echo "=============================="
          echo "GENERATED AI SCRIPT"
          echo "=============================="

          cat output/script.txt

          echo ""
          echo "=============================="

      - name: Upload generated script
        uses: actions/upload-artifact@v4
        with:
          name: day-001-ai-script
          path: output/script.txt
